# ==============================================================================
# KITTY CONFIGURATION - TRANSPARÊNCIA E ESTILO
# ==============================================================================

# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Opacidade do fundo (0.0 totalmente transparente, 1.0 totalmente opaco)
background_opacity 0.50

# Permite alterar a opacidade dinamicamente através de atalhos ou scripts
dynamic_background_opacity yes

# Fontes e estilo (opcional/recomendado)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Shell explícito. Sem isto o kitty usa $SHELL, que pode ficar apontando
# para um shell que não existe mais (era /usr/bin/zsh) até o próximo login.
shell /bin/bash

# Margens internas da janela (padding)
window_padding_width 8

# Desativa o sinal sonoro do terminal
enable_audio_bell no
