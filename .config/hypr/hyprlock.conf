# ============================================================
#  hyprlock — Ultra Clean Sci-Fi / Glassmorphism
#  Minimalista, refinado e com estética de vidro translúcido
# ============================================================

$font = JetBrainsMono Nerd Font

# Paleta Sci-Fi Minimalista
$accent_purple = rgba(203, 166, 247, 0.90)
$accent_violet = rgba(180, 190, 254, 0.40)
$glow_subtle   = rgba(203, 166, 247, 0.18)

$glass_inner   = rgba(17, 17, 27, 0.55)

$white         = rgba(245, 245, 250, 0.95)
$muted         = rgba(186, 194, 222, 0.75)
$dim           = rgba(108, 112, 134, 0.60)
$success       = rgba(166, 227, 161, 0.95)
$error         = rgba(243, 139, 168, 0.95)
$warning       = rgba(249, 226, 175, 0.95)

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fractional_scaling = 2
    immediate_render = true
}

auth {
    pam:enabled = true
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    bezier = snap,   0.2,  1, 0.2, 1

    animation = fadeIn,           1, 4, smooth
    animation = fadeOut,          1, 3, smooth
    animation = inputFieldColors, 1, 4, smooth
    animation = inputFieldFade,   1, 3, smooth
    animation = inputFieldWidth,  1, 3, snap
    animation = inputFieldDots,   1, 2, snap
}

# ------------------------------------------------------------
#  Fundo transparente para exibir o vídeo do mpvpaper atrás
#  (O lock.sh substitui este bloco pelo screenshot em fallback)
# ------------------------------------------------------------
# @BG_START
background {
    monitor =
    color = rgba(0, 0, 0, 0)
}
# @BG_END

# ------------------------------------------------------------
#  Relógio Digital Futurista (Hero)
# ------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = $white
    font_family = $font
    font_size = 88
    position = 0, 130
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(203, 166, 247, 0.30)
    shadow_boost = 1.15
}

# Data completa em português (elegante e espaçada)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=pt_BR.UTF-8 date "+%A, %d de %B de %Y" | sed -e 's/^./\U&/'
    color = $muted
    font_family = $font
    font_size = 14
    position = 0, 60
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  Identidade do Usuário (Clean)
# ------------------------------------------------------------
label {
    monitor =
    text = Olá, Ricardo
    color = $white
    font_family = $font
    font_size = 16
    position = 0, -35
    halign = center
    valign = center
}

# ------------------------------------------------------------
#  Campo de Senha em Pílula Translúcida (Capsule Glass)
# ------------------------------------------------------------
input-field {
    monitor =
    size = 280, 48
    position = 0, -95
    halign = center
    valign = center

    outline_thickness = 1
    rounding = -1

    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    inner_color = $glass_inner
    outer_color = $accent_purple $accent_violet 45deg
    font_color = $white
    font_family = $font

    check_color = $success
    fail_color = $error
    capslock_color = $warning

    fade_on_empty = false
    placeholder_text = <span foreground="##9399b2">digite a senha...</span>
    fail_text = <span foreground="##f38ba8">senha incorreta ($ATTEMPTS)</span>

    shadow_passes = 2
    shadow_size = 8
    shadow_color = $glow_subtle
    shadow_boost = 1.2
}

# ------------------------------------------------------------
#  Rodapé Minimalista (Status do Sistema)
# ------------------------------------------------------------
label {
    monitor =
    text = cmd[update:30000] echo "ricardo-alves@rical  •  $(uptime -p | sed 's/up /ativo há /; s/ hours\?/h/; s/ minutes\?/m/; s/,//')"
    color = $dim
    font_family = $font
    font_size = 11
    position = 0, 35
    halign = center
    valign = bottom
}
