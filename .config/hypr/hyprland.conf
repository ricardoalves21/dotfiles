###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod SHIFT, R, exec, $scriptsMenu
bind = $mainMod, T, exec, $scriptsMenu
bind = $mainMod, X, exec, $tabletToggle
bind = $mainMod, K, exec, $steam
bind = $mainMod, F1, exec, $keybindsMenu toggle
bind = $mainMod, H, exec, $keybindsMenu toggle
bind = $mainMod, N, exec, swaync-client -t -sw
# Fullscreen real (ocupa o monitor inteiro, sem gaps nem waybar).
# O modo 1 ("maximizar"): preenche a área útil respeitando gaps e barra.
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, G, fullscreen, 1
bind = $mainMod, A, exec, $HOME/.config/hypr/scripts/arrange-windows.py # Ajustar e redimensionar todas as janelas do workspace

bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Alternador visual de janelas com lista de títulos (SUPER + Tab)
bind = $mainMod, Tab, exec, $HOME/.config/hypr/scripts/window-switcher.sh

# Alternar ciclicamente entre janelas do workspace (ALT + Tab)
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev
bind = ALT SHIFT, Tab, bringactivetotop,

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Foco entre monitores
bind = $mainMod ALT, left, focusmonitor, l
bind = $mainMod ALT, right, focusmonitor, r
# Enviar janela ativa para o outro monitor
bind = $mainMod SHIFT, left, movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r
# Workspace anterior/próximo do monitor atual
bind = $mainMod, bracketleft, workspace, m-1
bind = $mainMod, bracketright, workspace, m+1

# Switch workspaces — LG (HDMI-A-1): SUPER + teclado principal (1..0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces — Samsung (DP-1): SUPER + numpad → workspaces 11-20 (exibidos como 1-10)
# Vinculado por keycode, não por keysym: as teclas do numpad emitem KP_1..KP_0 apenas no
# nível 2 do XKB (com NumLock), e o Hyprland casa binds no nível base (KP_End, KP_Down, ...).
# O keycode é estável independente de NumLock e do layout.
bind = $mainMod, code:87, workspace, 11   # numpad 1
bind = $mainMod, code:88, workspace, 12   # numpad 2
bind = $mainMod, code:89, workspace, 13   # numpad 3
bind = $mainMod, code:83, workspace, 14   # numpad 4
bind = $mainMod, code:84, workspace, 15   # numpad 5
bind = $mainMod, code:85, workspace, 16   # numpad 6
bind = $mainMod, code:79, workspace, 17   # numpad 7
bind = $mainMod, code:80, workspace, 18   # numpad 8
bind = $mainMod, code:81, workspace, 19   # numpad 9
bind = $mainMod, code:90, workspace, 20   # numpad 0

# Move active window to a workspace — LG: SUPER + SHIFT + teclado principal
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace — Samsung: SUPER + SHIFT + numpad (ver nota sobre keycodes acima)
bind = $mainMod SHIFT, code:87, movetoworkspace, 11   # numpad 1
bind = $mainMod SHIFT, code:88, movetoworkspace, 12   # numpad 2
bind = $mainMod SHIFT, code:89, movetoworkspace, 13   # numpad 3
bind = $mainMod SHIFT, code:83, movetoworkspace, 14   # numpad 4
bind = $mainMod SHIFT, code:84, movetoworkspace, 15   # numpad 5
bind = $mainMod SHIFT, code:85, movetoworkspace, 16   # numpad 6
bind = $mainMod SHIFT, code:79, movetoworkspace, 17   # numpad 7
bind = $mainMod SHIFT, code:80, movetoworkspace, 18   # numpad 8
bind = $mainMod SHIFT, code:81, movetoworkspace, 19   # numpad 9
bind = $mainMod SHIFT, code:90, movetoworkspace, 20   # numpad 0

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll pelos workspaces do monitor atual com mainMod + scroll
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up, workspace, m-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Screenshots (grim + slurp + wl-clipboard) ---
# Salvam em ~/Imagens/Screenshots e copiam para a área de transferência
bind = , Print, exec, $screenshot region              # seleção com o mouse
bind = $mainMod SHIFT, P, exec, $screenshot region    # seleção com o mouse (SUPER + SHIFT + P)
bind = SHIFT, Print, exec, $screenshot screen         # monitor atual
bind = CTRL, Print, exec, $screenshot window          # janela ativa
# Só para a área de transferência, sem salvar arquivo
bind = $mainMod SHIFT, Print, exec, $screenshot region --copy-only

# --- Tela de bloqueio (vídeo via mpvpaper + hyprlock) ---
# O script cuida do xray e do fallback opaco; não chame hyprlock direto.
bind = $mainMod, L, exec, ~/.config/hypr/scripts/lock.sh
# Menu do vídeo que roda no fundo do bloqueio (~/Vídeos/video_wallpaper)
bind = $mainMod, I, exec, ~/.config/hypr/scripts/lockvideo.sh menu
# Menu de Energia / Sessão (SUPER + Esc ou SUPER + U)
bind = $mainMod, Escape, exec, $powerMenu toggle
bind = $mainMod, U, exec, $powerMenu toggle

# --- Wallpapers ---
# Menu de vídeo wallpaper para o monitor em foco (~/Vídeos/video_wallpaper)
bind = $mainMod, O, exec, $videoWallpaper menu
# Seletor interativo de wallpapers para o monitor em foco
bind = $mainMod, W, exec, $wallpaperMenu
bind = $mainMod SHIFT, W, exec, $wallpaper prev
bind = $mainMod ALT, W, exec, $wallpaper random

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# --- Layer rules (sintaxe 0.53): blur atrás das barras e menus translúcidos ---
# O namespace da camada da waybar é o "name" definido no config dela
layerrule = blur on, ignore_alpha 0.2, animation slide, match:namespace ^waybar-.*
layerrule = blur on, ignore_alpha 0.3, animation popin 80%, match:namespace ^wofi$
layerrule = blur on, ignore_alpha 0.3, animation popin 80%, match:namespace ^rofi$
layerrule = blur on, ignore_alpha 0.3, match:namespace ^swaync-control-center$
layerrule = blur on, ignore_alpha 0.3, match:namespace ^swaync-notification-window$
# Sem animação na camada de seleção (slurp), evitando que o filtro verde saia no print
layerrule = no_anim on, match:namespace ^selection$

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps (mantém fullscreen nativo para vídeos/F11).
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# Novas janelas abrem flutuantes (sem se encaixar no tile e sem se esticar), centralizadas
windowrule {
    name = default-float-all
    match:class = .*

    float = on
    center = on
}

# Janelas de autenticação Polkit sempre centralizadas, no topo e em foco
windowrule {
    name = polkit-authentication-dialog
    match:class = ^(hyprpolkitagent|org\.hyprland\.polkitagent|polkit-gnome-authentication-agent-1)$

    float = yes
    pin = yes
    center = yes
    stay_focused = yes
    dim_around = yes
}

# Calendário interativo flutuante
windowrule {
    name = calendar-popup-rule
    match:class = ^(calendar-popup)$

    float = yes
    pin = yes
    center = yes
    stay_focused = yes
}

# YouTube Miniplayer flutuante (canto superior direito do monitor DP-1)
windowrule {
    name = youtube-miniplayer-rule
    match:class = ^(youtube-miniplayer.*)$

    float = yes
    pin = yes
    move = 1540 52
    size = 360 240
}

# Instalador leve de pacotes .deb e Atualizador do Sistema no Kitty (flutuantes e centralizados)
windowrule {
    name = kitty-deb-installer
    match:class = ^(deb-installer|system-updater)$

    float = yes
    center = yes
    size = 820 540
}

# Flameshot: overlay de captura sem animação e alinhado na origem dos monitores
windowrule {
    name = flameshot-capture
    match:class = ^(flameshot)$

    no_anim = on
    float = on
    pin = on
    stay_focused = on
    move = 0 0
    border_size = 0
    rounding = 0
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}





