### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 12

    border_size = 2

    # Gradiente em tons de roxo / violeta / magenta neon
    col.active_border = rgba(cba6f7ff) rgba(a855f7ff) rgba(d946efff) rgba(cba6f7ff) 45deg
    col.inactive_border = rgba(25173caa)

    # Redimensionar arrastando a borda/gap
    resize_on_border = true
    extend_border_grab_area = 12
    hover_icon_on_border = true

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2.6

    # Janelas 100% opacas (legibilidade em editor e terminal)
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    # Sombra com brilho roxo neon na janela focada
    shadow {
        enabled = true
        range = 28
        render_power = 3
        sharp = false
        offset = 0 0
        scale = 1.0
        color = rgba(a855f766)
        color_inactive = rgba(00000055)
    }

    # Blur afeta superfícies translúcidas: waybar, wofi, swaync
    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        xray = true
        ignore_opacity = true
        noise = 0.015
        contrast = 1.0
        brightness = 0.85
        vibrancy = 0.25
        vibrancy_darkness = 0.15
        popups = true
        popups_ignorealpha = 0.2
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Curvas, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,    Y0,    X1,   Y1
    bezier = easeOutQuint,   0.23,  1,     0.32, 1
    bezier = easeInOutCubic, 0.65,  0.05,  0.36, 1
    bezier = linear,         0,     0,     1,    1
    bezier = almostLinear,   0.5,   0.5,   0.75, 1
    bezier = quick,          0.15,  0,     0.1,  1
    # Curvas com overshoot (o "quique" elástico)
    bezier = overshot,       0.05,  0.9,   0.1,  1.15
    bezier = bounce,         0.34,  1.56,  0.64, 1
    bezier = snappy,         0.2,   1.0,   0.2,  1.0
    bezier = smoothIn,       0.16,  1,     0.3,  1

    # Animações, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     8,     easeOutQuint
    # Abrir/fechar janela: entra com quique, sai encolhendo
    animation = windows,       1,     6,     overshot,     popin 60%
    animation = windowsIn,     1,     6.5,   bounce,       popin 40%
    animation = windowsOut,    1,     4,     easeInOutCubic, popin 70%
    animation = windowsMove,   1,     5,     smoothIn,     slide
    # Borda: gradiente que gira continuamente na janela focada
    animation = border,        1,     8,     smoothIn
    animation = borderangle,   1,     60,    linear,       loop
    animation = fade,          1,     4,     smoothIn
    animation = fadeIn,        1,     3,     almostLinear
    animation = fadeOut,       1,     2.5,   almostLinear
    animation = fadeSwitch,    1,     3,     almostLinear
    animation = fadeDim,       1,     3,     almostLinear
    # Camadas (waybar, wofi, notificações) deslizam para dentro
    animation = layers,        1,     4,     overshot,     slide
    animation = layersIn,      1,     4.5,   overshot,     slide
    animation = layersOut,     1,     3,     easeInOutCubic, slide
    animation = fadeLayersIn,  1,     2.5,   almostLinear
    animation = fadeLayersOut, 1,     2,     almostLinear
    # Troca de workspace com deslize amplo
    animation = workspaces,    1,     5,     overshot,     slide
    animation = workspacesIn,  1,     5.5,   overshot,     slide
    animation = workspacesOut, 1,     4.5,   easeInOutCubic, slide
    animation = specialWorkspace, 1,  6,     overshot,     slidevert
    animation = zoomFactor,    1,     7,     quick
}

