################
### MONITORS ###
################

# Configuração dos monitores:
# Monitor Esquerdo (HDMI-A-1 - Philips 223V5LH 60Hz)
monitor=HDMI-A-1,1920x1080@60,0x0,1
# Monitor Direito (DP-1 - Philips 221V8 60Hz)
monitor=DP-1,1920x1080@60,1920x0,1
# Fallback genérico para outros monitores
monitor=,preferred,auto,1

# Grupos independentes de workspaces por monitor (10 por monitor):
# Workspaces 1-10 ficam no monitor maior (HDMI-A-1 / LG) — atalho: SUPER + teclado principal
workspace = 1,  monitor:HDMI-A-1, default:true, persistent:true
workspace = 2,  monitor:HDMI-A-1, persistent:true
workspace = 3,  monitor:HDMI-A-1
workspace = 4,  monitor:HDMI-A-1
workspace = 5,  monitor:HDMI-A-1
workspace = 6,  monitor:HDMI-A-1
workspace = 7,  monitor:HDMI-A-1
workspace = 8,  monitor:HDMI-A-1
workspace = 9,  monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1
# Workspaces 11-20 ficam no monitor menor (DP-1 / Samsung) — atalho: SUPER + numpad (exibidos como 1-10)
workspace = 11, monitor:DP-1, default:true, persistent:true
workspace = 12, monitor:DP-1, persistent:true
workspace = 13, monitor:DP-1
workspace = 14, monitor:DP-1
workspace = 15, monitor:DP-1
workspace = 16, monitor:DP-1
workspace = 17, monitor:DP-1
workspace = 18, monitor:DP-1
workspace = 19, monitor:DP-1
workspace = 20, monitor:DP-1


###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$browser = firefox
# Wrapper que resolve a versão mais recente instalada em ~/opt (sobrevive a
# atualizações). O mesmo binário é usado pelo lançador do wofi, via
# ~/.local/share/applications/devin.desktop.
$devinIde = $HOME/.local/bin/devin-ide

# Lançador de aplicativos (SUPER + R). Tema Catppuccin Mocha em
# ~/.config/wofi/{config,style.css}; os caminhos são explícitos porque o
# Hyprland pode subir por um display manager com XDG_CONFIG_HOME vazio.
$menu = wofi --show drun --conf $HOME/.config/wofi/config --style $HOME/.config/wofi/style.css
# Steam: caminho explícito da instalação snap (a que tem a biblioteca de jogos).
# Existe também uma Steam flatpak instalada, e as duas aparecem no wofi com o
# nome idêntico "Steam" — chamar o binário direto tira a ambiguidade. O cliente
# leva ~10s para desenhar a janela; até lá não há sinal nenhum na tela.
$steam = /snap/bin/steam
$screenshot = $HOME/.config/hypr/scripts/screenshot.sh
$wallpaper = $HOME/.config/hypr/scripts/wallpaper.sh
$videoWallpaper = $HOME/.config/hypr/scripts/videowallpaper.sh
$scriptsMenu = $HOME/.config/hypr/scripts/scripts-menu.sh
$powerMenu = $HOME/.config/hypr/scripts/powermenu.sh
$keybindsMenu = $HOME/.config/hypr/scripts/keybinds.sh
$wallpaperMenu = $HOME/.config/hypr/scripts/wallpaper-menu.sh
$tabletToggle = $HOME/.config/hypr/scripts/toggle-tablet-monitor.sh


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Propaga variáveis da sessão Wayland para o D-Bus/systemd e inicia o agente Polkit
# (necessário para janelas de senha de root/admin nos apps gráficos do Ubuntu)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE && (systemctl --user start hyprpolkitagent.service || true)
exec-once = waybar
# Daemon de wallpaper: awww (transição animada), hyprpaper como fallback.
# O PATH precisa ser corrigido aqui dentro: o display manager não lê
# ~/.profile, então ~/.local/bin (onde mora o awww-daemon) não chega até aqui
# e o fallback dispararia sempre, mesmo com o awww instalado.
exec-once = sh -c 'PATH="$HOME/.local/bin:$PATH"; command -v awww-daemon >/dev/null && exec awww-daemon || exec hyprpaper'
exec-once = swaync
exec-once = blueman-applet
exec-once = $HOME/.config/hypr/scripts/youtube-player.sh daemon
# Restaura o último wallpaper escolhido. O wallpaper.sh espera o daemon por
# conta própria (via `awww query`), então não há sleep arbitrário aqui.
exec-once = $HOME/.config/hypr/scripts/wallpaper.sh restore
# Restaura o vídeo de wallpaper se houver algum configurado por monitor
exec-once = $videoWallpaper restore

# Apps de sessão desabilitados no autostart — abrir manualmente (wofi / keybind).
# exec-once = $devinIde
# exec-once = $browser


# Or execute your favorite apps at launch like this:


# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


