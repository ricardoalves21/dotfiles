# FALLBACK. O backend padrão hoje é o awww (transição animada) e ele não lê
# arquivo de config nenhum: quem define o wallpaper inicial é o
# `wallpaper.sh restore` no exec-once. Este arquivo só entra em jogo se o
# awww-daemon não estiver instalado, quando o hyprpaper assume.
#
# Wallpaper inicial do boot. A troca dinâmica é feita por
# ~/.config/hypr/scripts/wallpaper.sh (botão da waybar / Super+W),
# que sobrescreve isto em runtime via IPC.
preload = ~/Imagens/Wallpapers/wallpaper1_hacker.png
preload = ~/Imagens/Wallpapers/wallpaper2_scifi_core.png

wallpaper = HDMI-A-1,~/Imagens/Wallpapers/wallpaper1_hacker.png
wallpaper = DP-1,~/Imagens/Wallpapers/wallpaper2_scifi_core.png

splash = false
ipc = on
